# Hooks are pinned to commit SHAs (tag in the comment). Update with:
#   uvx pre-commit autoupdate --freeze
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      # --enforce-all: check every file passed in, not only newly added ones, so `--all-files` (CI) checks too.
      - id: check-added-large-files
        args: [--maxkb=500, --enforce-all]
        exclude: ^(uv\.lock|docs/assets/[^/]+\.webp)$
      # The README's full-length before/after comparisons (animated WebP, directly in docs/assets/) run 15-20 s
      # and are larger than 500 KB. Allow up to 3 MB for them only; everything else keeps the 500 KB limit above.
      - id: check-added-large-files
        name: check for added large files (docs/assets/*.webp, 3 MB)
        args: [--maxkb=3000, --enforce-all]
        files: ^docs/assets/[^/]+\.webp$
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd # v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2 # v1.30.1
    hooks:
      - id: zizmor

  # Workflow syntax, expressions and types. Uses shellcheck on `run:` scripts when it is on PATH
  # (always in CI; optional locally, see docs/dev/ci.md). zizmor above covers security.
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
    hooks:
      - id: actionlint
