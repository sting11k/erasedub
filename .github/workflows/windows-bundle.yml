# Builds the portable Windows x64 + NVIDIA bundle (packaging/windows/build.ps1).
#
# - workflow_dispatch: build and upload a workflow artifact only.
# - workflow_call (from release.yml on a v* tag): build, then with `upload: true` attest the archive and
#   upload it to the EXISTING DRAFT release named by `tag`. This workflow never creates, edits or
#   publishes a release, and it refuses to touch a release that is already published.
#   The caller must grant: contents: write, id-token: write, attestations: write.
name: Windows bundle

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose draft release receives the bundle (required when upload is true).
        type: string
        required: false
        default: ""
      upload:
        description: Upload the bundle to the draft release named by `tag`.
        type: boolean
        required: false
        default: false

permissions: {}

# Job-level concurrency with a literal prefix: in a called workflow `github.workflow` is the CALLER's
# name, so a workflow-level group like release.yml's would collide with the caller and deadlock.
jobs:
  build:
    name: Build bundle
    runs-on: windows-latest
    timeout-minutes: 150
    concurrency:
      group: windows-bundle-build-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false # no cache in a workflow that produces release assets

      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1 -OutDir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erasedub-windows-bundle
          path: |
            dist/*.7z*
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0 # already 7z-compressed

  upload:
    name: Upload to draft release
    needs: build
    if: inputs.upload && github.repository == 'sting11k/erasedub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: windows-bundle-upload-${{ inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write # upload assets to the draft release
      id-token: write # OIDC token for the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - name: Check the release is an existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::input 'tag' is required when upload is true"
            exit 1
          fi
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)" || {
            echo "::error::no release for $TAG; release.yml must create the draft first"
            exit 1
          }
          if [ "$is_draft" != "true" ]; then
            echo "::error::release $TAG is already published; refusing to change its assets"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: erasedub-windows-bundle
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.7z*

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          # Re-check right before uploading: --clobber is only acceptable on a draft.
          [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ] || {
            echo "::error::release $TAG is no longer a draft; refusing to upload"
            exit 1
          }
          gh release upload "$TAG" dist/*.7z* dist/SHA256SUMS.txt --clobber
