# Categories for GitHub's auto-generated release notes (`gh release create --generate-notes`).
# PRs are sorted by label; the first matching category wins. Label names are the canonical
# list in docs/dev/ci.md.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Docs
      labels: [documentation]
    - title: Maintenance
      labels: [dependencies, ci, packaging]
    - title: Other changes
      labels: ["*"]
